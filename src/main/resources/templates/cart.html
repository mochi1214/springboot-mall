<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>購物車</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    h1 {
      text-align: center;
      color: #333;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
    }

    table thead tr {
      background-color: #007bff;
      color: #fff;
    }

    table th, table td {
      padding: 12px;
      text-align: center;
      border: 1px solid #ddd;
    }

    table th {
      background-color: #007bff;
      color: #fff;
    }

    .total-row {
      font-weight: bold;
      background-color: #f4f4f4;
    }

    .empty-cart {
      text-align: center;
      color: #777;
      font-size: 18px;
      margin-top: 20px;
    }

    /* 按鈕樣式 */
    .btn {
      display: inline-block;
      padding: 10px 15px;
      font-size: 16px;
      text-decoration: none;
      border-radius: 5px;
      transition: all 0.3s ease;
    }

    .btn-success {
      background-color: #28a745;
      color: white;
    }

    .btn-success:hover {
      background-color: #218838;
    }

    .btn-danger {
      background-color: #dc3545;
      color: white;
      border: none;
    }

    .btn-danger:hover {
      background-color: #c82333;
    }

    .btn-warning {
      background-color: #ffc107;
      color: black;
      border: none;
    }

    .btn-warning:hover {
      background-color: #e0a800;
    }

    .checkout-btn {
      background-color: #ff9800; /* 橙色 */
      color: white;
      font-size: 18px;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .checkout-btn:hover {
      background-color: #e68900;
      transform: scale(1.05);
    }

    .checkout-btn:active {
      transform: scale(0.95);
    }

    .cart-actions {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      padding: 10px;
    }
  </style>
</head>
<body>
<h1>購物車</h1>

<div>
  <!-- 如果購物車為空，顯示提示訊息 -->
  <div th:if="${cartItems.size() == 0}" class="empty-cart">
    您的購物車是空的。
  </div>

  <!-- 如果購物車有商品，顯示商品列表 -->
  <table th:if="${cartItems.size() > 0}">
    <thead>
    <tr>
      <th>商品名稱</th>
      <th>數量</th>
      <th>單價</th>
      <th>總價</th>
      <th>操作</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="cartItem : ${cartItems}">
      <td th:text="${cartItem.productName ?: '未命名商品'}"></td>
      <td th:text="${cartItem.quantity ?: 0}"></td>
      <td th:text="${cartItem.price ?: 0} + ' 元'"></td>
      <td th:text="${(cartItem.quantity ?: 0) * (cartItem.price ?: 0)} + ' 元'"></td>
      <td>
        <form th:action="@{'/cart/remove/' + ${cartItem.productId}}" method="post" style="display:inline;">
          <button type="submit" class="btn btn-warning">移除</button>
        </form>
      </td>
    </tr>
    </tbody>
    <tfoot>
    <tr class="total-row">
      <td colspan="3">總計</td>
      <td th:text="${totalAmount} + ' 元'"></td>
      <td></td>
    </tr>
    </tfoot>
  </table>
</div>

<!-- 操作按鈕 -->
<div class="cart-actions">
  <a href="/purchase" class="btn btn-success">返回購物頁面</a>
  <form th:action="@{/cart/checkout}" method="post" style="display:inline;">
    <button type="submit" class="checkout-btn">結帳</button>
  </form>
  <form th:action="@{/cart/clear}" method="post" style="display:inline;">
    <button type="submit" class="btn btn-danger">清空購物車</button>
  </form>
</div>

</body>
</html>
